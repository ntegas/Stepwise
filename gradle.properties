org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Required (not just an optimization) once any Android-Gradle-Plugin-dependent
# module exists alongside pure-JVM ones: without it, Gradle configures every
# project in the build regardless of which module's task was requested, so an
# unresolvable AGP plugin (this sandbox cannot reach dl.google.com) would break
# :core:common's build too, even though :core:common has no Android dependency.
# Verified empirically in this sandbox (DEV-003) before adopting it — `configure
# on demand` has been a Gradle feature since 1.x and is widely used in production
# multi-module Android projects despite never leaving "incubating" status.
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.4.0's built-in Kotlin support (default since AGP 9.0) crashes on plugin
# application in this project: "Could not create an instance of type
# KotlinAndroidTarget... com/android/build/gradle/api/BaseVariant" — a genuine
# incompatibility between AGP 9.4.0's already-changed legacy Variant API and
# the Kotlin Gradle plugin classes AGP's own built-in Kotlin bridging code
# depends on. Confirmed via an actual CI failure that this happens purely from
# applying com.android.library — with NO explicit Kotlin plugin of any kind
# applied — so it isn't fixable by choosing different plugins on our side.
# android.builtInKotlin=false reverts to the classic (pre-AGP-9) model:
# modules apply org.jetbrains.kotlin.android explicitly again, which sidesteps
# this code path entirely. Per Android's own migration docs, this opt-out
# stops working in AGP 10.0 — revisit then, or sooner if this specific AGP
# 9.4.0/Kotlin 2.4.20 incompatibility is fixed upstream.
android.builtInKotlin=false

# Required alongside android.builtInKotlin=false — this was the actual root
# cause of 5 prior CI failures (all "org.jetbrains.kotlin.android ... already
# on the classpath with an unknown version"), verified against
# developer.android.com/build/migrate-to-built-in-kotlin: the classic
# kotlin-android plugin is NOT compatible with AGP 9's new DSL, so builtInKotlin
# alone leaves AGP still registering the `kotlin` extension itself under the
# new DSL, colliding with our explicit plugin application. Both flags together
# are what actually reverts to the pre-AGP-9 model end to end.
android.newDsl=false

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Required (not just an optimization) once any Android-Gradle-Plugin-dependent
# module exists alongside pure-JVM ones: without it, Gradle configures every
# project in the build regardless of which module's task was requested, so an
# unresolvable AGP plugin (this sandbox cannot reach dl.google.com) would break
# :core:common's build too, even though :core:common has no Android dependency.
# Verified empirically in this sandbox (DEV-003) before adopting it — `configure
# on demand` has been a Gradle feature since 1.x and is widely used in production
# multi-module Android projects despite never leaving "incubating" status.
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# DEV-003 spent 8 real CI iterations on AGP 9.4.0's built-in-Kotlin support
# before stepping back rather than continuing to guess:
#   1-2. android-actions/setup-android removed; explicit kotlin-android plugin
#        removed ("already on the classpath with an unknown version" — AGP 9's
#        built-in Kotlin puts its own copy on the classpath).
#   3-4. explicit kotlin.plugin.compose also removed; crash persisted with
#        NEITHER Kotlin plugin applied ("Could not create an instance of type
#        KotlinAndroidTarget... com/android/build/gradle/api/BaseVariant") —
#        proving the crash is inside AGP 9.4.0's own built-in Kotlin bridging
#        code, triggered by com.android.library alone.
#   5-6. android.builtInKotlin=false, then +android.newDsl=false (both
#        documented at developer.android.com/build/migrate-to-built-in-kotlin
#        as required together) — the crash went away but the ORIGINAL
#        "already on the classpath" error came back identically, meaning
#        AGP 9.4.0 still has Kotlin Gradle Plugin classes on its buildscript
#        classpath even with both opt-outs set. Never diagnosed further:
#        decided the built-in-Kotlin feature area in this specific AGP/Kotlin
#        pairing isn't reliably escapable from this side.
# Decision: downgrade to AGP 8.13.2 (see libs.versions.toml), the last stable
# pre-9.0 line, which has no built-in-Kotlin code path at all — the classic
# explicit org.jetbrains.kotlin.android + org.jetbrains.kotlin.plugin.compose
# model (already what core/designsystem/build.gradle.kts applies) is exactly
# what that line expects, no opt-out flags needed. AGP 8.13 still supports up
# to API level 36.1 (developer.android.com/build/releases/agp-8-13-0-release-notes),
# so compileSdk 36 is unaffected. This is a build-tooling version pin, not a
# product/architecture decision — no ARCHITECTURE.md/ROADMAP.md text commits
# to an AGP major version, so nothing here is being silently overridden.
# Gradle wrapper reverted to 8.14.5 to match (AGP 8.13's minimum is Gradle
# 8.13; 8.14.5 is the exact version DEV-001 already verified empirically in
# this sandbox for :core:common, so it carries no new risk).

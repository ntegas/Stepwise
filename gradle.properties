org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Required (not just an optimization) once any Android-Gradle-Plugin-dependent
# module exists alongside pure-JVM ones: without it, Gradle configures every
# project in the build regardless of which module's task was requested, so an
# unresolvable AGP plugin (this sandbox cannot reach dl.google.com) would break
# :core:common's build too, even though :core:common has no Android dependency.
# Verified empirically in this sandbox (DEV-003) before adopting it — `configure
# on demand` has been a Gradle feature since 1.x and is widely used in production
# multi-module Android projects despite never leaving "incubating" status.
org.gradle.configureondemand=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# DEV-003's full iteration history (11+ real CI runs — see DEVELOPMENT_LOG.md/
# PROJECT_STATE.md for the complete account; summarized here because it directly
# explains these two properties):
#   1-2. android-actions/setup-android removed (unrelated CI setup bug); explicit
#        kotlin-android plugin removed after "already on the classpath with an
#        unknown version" — misdiagnosed at the time as AGP 9's built-in Kotlin
#        claiming the classpath.
#   3-4. explicit kotlin.plugin.compose also removed; a DIFFERENT crash
#        appeared/persisted ("Could not create an instance of type
#        KotlinAndroidTarget... com/android/build/gradle/api/BaseVariant") with
#        NEITHER Kotlin plugin applied — read at the time as proof the crash was
#        inside AGP 9.4.0's built-in Kotlin bridging code itself.
#   5-6. android.builtInKotlin=false, then +android.newDsl=false (both
#        documented together at developer.android.com/build/migrate-to-built-in-kotlin)
#        — the BaseVariant crash went away but the ORIGINAL "already on the
#        classpath" error came back identically.
#   7-8. downgraded AGP to 8.13.2 (the last pre-9.0 line, no built-in-Kotlin
#        code path at all) to escape the feature area entirely — the IDENTICAL
#        "already on the classpath" error reproduced anyway, proving iterations
#        1-6 had all been chasing the wrong cause: it was never AGP-version-
#        specific.
#   9. real root cause found: root build.gradle.kts only ever apply-false'd
#      kotlin-jvm (for :core:common) — org.jetbrains.kotlin.jvm and org.
#      jetbrains.kotlin.android are different plugin IDs backed by the same
#      underlying Kotlin Gradle Plugin artifact, and resolving kotlin-android
#      for the first time inside core/designsystem's own plugins{} block
#      collided with it. Declaring kotlin-android/kotlin-compose apply-false at
#      root too fixed this error — but surfaced NoClassDefFoundError on
#      com.android.build.gradle.BaseExtension, since the Kotlin Android Gradle
#      plugin's classes statically reference AGP classes and AGP itself still
#      wasn't resolved anywhere at root.
#   10. declared android.library apply-false at root too (see build.gradle.kts)
#       — the standard Android Studio multi-module convention every iteration
#       had deviated from specifically to keep :core:common locally buildable
#       in this dl.google.com-blocked sandbox. This is what actually fixed
#       plugin resolution end to end.
#   11. with plugin resolution finally clean, AGP 8.13.2 turned out to be
#       flatly incompatible with Compose BOM 2026.08.00 anyway (its own
#       dependencies require AGP >=9.1.0 and compileSdk >=37) — moved back to
#       AGP 9.4.0, this time with the real bug from steps 9-10 already fixed.
# android.builtInKotlin=false and android.newDsl=false are kept as a defensive
# belt-and-suspenders measure: whether the BaseVariant crash from steps 3-4 was
# itself ever a real, separate AGP-9-built-in-Kotlin bug (as opposed to another
# manifestation of the same apply-false gap) was never conclusively re-tested
# after step 10's fix, so the known-safe classic explicit-plugin model stays in
# place rather than re-introducing an unconfirmed risk. Revisit if AGP 10.0
# removes this opt-out (per Android's own migration docs) and a re-test becomes
# necessary anyway.
android.builtInKotlin=false
android.newDsl=false

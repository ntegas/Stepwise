[versions]
# One version catalog project-wide (DEVELOPMENT_PROTOCOL.md rule 37) — no module
# pins a library version independently. Entries below are only for dependencies
# actually consumed by an existing module today; a version is added here only
# when a DEV task actually needs it (DEPENDENCY_POLICY.md — "actually necessary"),
# not speculatively for future modules.
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
# Runtime only here — no module in this project declares a new @Serializable type yet, so no
# module needs the kotlinx.serialization compiler plugin; :core:network only round-trips
# supabase-kt's own already-serializable UserSession through Json.
kotlinx-serialization = "1.9.0"
junit-jupiter = "5.13.4"
kotlin-test = "2.4.20"
# Pinned to the last stable 1.x line under the pre-rename coordinates
# (io.gitlab.arturbosch.detekt). detekt 2.0 exists only as an alpha
# (dev.detekt coordinates) as of this pin — reconsider once 2.0 is stable.
# Verified working under Gradle 8.14.5 (DEV-001/DEV-002).
detekt = "1.23.8"
ktlint-gradle = "14.2.0"
# DEV-003's iteration history (see gradle.properties and DEVELOPMENT_LOG.md
# for the full account): iterations 1-9 chased AGP 9.4.0's built-in-Kotlin
# support as the cause of a plugin-resolution error and, after 8 failures,
# stepped back to AGP 8.13.2 to escape that feature area entirely — wrong:
# the identical error reproduced under 8.13.2 too. Iterations 10-11 found the
# real cause (root build.gradle.kts wasn't apply-false'ing every plugin used
# anywhere in the build) and fixed it independent of AGP version. With that
# fixed, AGP 8.13.2 turned out to be flatly incompatible anyway: Compose BOM
# 2026.08.00's own dependencies require AGP >=9.1.0 and compileSdk >=37
# (a real CI AAR-metadata failure, iteration 11) — so back to 9.4.0, this
# time with the actual bug already fixed at the root. Requires Gradle
# >=9.6.0 (checked live against AGP's release notes).
android-gradle-plugin = "9.4.0"
compose-bom = "2026.08.00"
# Room 2.x (androidx.room package), not the KMP-focused 3.0 rewrite (androidx.room3,
# a different package/artifact family) — DEV-005 confirmed with the product owner that
# :core:database stays a standard Android module for now (KMP would need dl.google.com
# for Room/sqlite artifacts regardless of Android vs JVM target in this sandbox, since
# they're Google-Maven-only either way, so it wouldn't have bought any real local-
# verification benefit here). 2.8.5 is the latest stable 2.x release, checked live.
room = "2.8.5"
# KSP's newer versioning (2.3.x) is decoupled from the Kotlin-version-prefixed scheme
# older releases used; checked live against Maven Central's own version metadata for
# the plugin marker artifact rather than assumed compatible with Kotlin 2.4.20.
ksp = "2.3.12"
# Room DAO tests need an actual Android runtime (Room generates real SQLite-backed
# implementations) — Robolectric is the standard, officially-documented way to run
# that on the JVM without an emulator. Robolectric still has no official JUnit 5
# support as of this pin (checked live: only a small, unofficial, actively-evolving
# community extension exists) — DEPENDENCY_POLICY.md prefers the mature, officially-
# supported path over an experimental one, so this one test area uses plain JUnit 4
# (Robolectric's own long-standing, documented model), not this project's usual
# JUnit 5 (:core:common/:core:model) — a deliberate, stated exception, not a drift.
junit4 = "4.13.2"
robolectric = "4.17"
androidx-test-junit = "1.3.0"
# supabase-kt: community-maintained (supabase-community GitHub org), real release
# history, actively developed (DEPENDENCY_POLICY.md checks) — 3.9.0 confirmed as the
# latest non-beta/non-rc "Latest"-tagged GitHub release at pin time. Group changed
# from the historical io.github.jan-tennert.supabase (still current) — Auth module
# was renamed gotrue-kt -> auth-kt at 3.0.0, confirmed from the project's own README.
supabase-kt-bom = "3.9.0"
# Pinned to the exact Ktor version supabase-kt's own build pins internally (checked
# live against its gradle/libs.versions.toml) rather than this project's latest, to
# minimize the chance of an untested Ktor/supabase-kt combination.
ktor = "3.6.1"
# androidx.security.crypto backs the Keystore-encrypted session storage
# ARCHITECTURE.md §11 requires (never supabase-kt's own default SharedPreferences-
# based SessionManager) — official AndroidX, 1.1.x is the current stable line.
androidx-security-crypto = "1.1.0"
# DEV-015 (:app, :feature:today) — first task needing DI/navigation/activity
# entry-point libraries. Checked live (WebSearch, this sandbox has no direct
# dl.google.com/Maven Central access to verify further): Dagger/Hilt's latest
# confirmed stable is 2.59 (a January 2026 dependency-bot bump from 2.58,
# adding AGP 9 support — consistent with this project's AGP 9.4.0 pin).
hilt = "2.59"
# 2.10.2, the latest stable `androidx.navigation` line confirmed live (a
# September 2026 release-table snapshot). lifecycle-viewmodel-compose is
# pinned to the same 2.10.x line below on the assumption Jetpack's lifecycle/
# navigation release trains move together, since this sandbox could not
# independently confirm lifecycle's own latest stable past 2.10.0 (a search
# surfaced an unconfirmed 2.11.0 listing with no verifiable stable-release
# date) — same class of "can't verify live from this sandbox" disclosure as
# DEV-007's Google ID token nonce item; worth re-checking once CI resolves
# real dependency metadata.
androidx-navigation = "2.10.2"
androidx-lifecycle-viewmodel-compose = "2.10.2"
# androidx.hilt (a separate artifact family from com.google.dagger:hilt-android itself) -
# confirmed live as 1.4.0, stable since July 2026.
androidx-hilt-navigation-compose = "1.4.0"
# 1.13.0, confirmed live as the current stable `androidx.activity` line
# (a September 2026 release-table snapshot; 1.14.0-alpha03 was the newest
# pre-release at the same snapshot).
androidx-activity-compose = "1.13.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin-test" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
supabase-kt-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase-kt-bom" }
supabase-kt = { module = "io.github.jan-tennert.supabase:supabase-kt" }
supabase-auth-kt = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle-viewmodel-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle-viewmodel-compose" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidx-hilt-navigation-compose" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# AGP 9's built-in Kotlin support is disabled (android.builtInKotlin=false in
# gradle.properties), so every Android module applies these explicitly —
# see that file for why.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
hilt-android-gradle-plugin = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
# Declared apply-false at root from the start (DEV-003 retrospective, ANTI_ERROR_STANDARD.md
# §11) — every plugin used anywhere in the build gets one root declaration up front,
# rather than discovering the gap the hard way again.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[versions]
# One version catalog project-wide (DEVELOPMENT_PROTOCOL.md rule 37) — no module
# pins a library version independently. Entries below are only for dependencies
# actually consumed by an existing module today; a version is added here only
# when a DEV task actually needs it (DEPENDENCY_POLICY.md — "actually necessary"),
# not speculatively for future modules.
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
junit-jupiter = "5.13.4"
kotlin-test = "2.4.20"
# Pinned to the last stable 1.x line under the pre-rename coordinates
# (io.gitlab.arturbosch.detekt). detekt 2.0 exists only as an alpha
# (dev.detekt coordinates) as of this pin — reconsider once 2.0 is stable.
# Verified working under Gradle 8.14.5 (DEV-001/DEV-002).
detekt = "1.23.8"
ktlint-gradle = "14.2.0"
# DEV-003 initially pinned 9.4.0 (which requires Gradle >=9.6.0) for its
# built-in-Kotlin support, but 8 real CI failures across that feature area
# (see gradle.properties for the full account) led to stepping back to the
# last stable pre-9.0 line instead — no built-in-Kotlin code path to fight,
# just the classic explicit-plugin model every AGP 8.x project already uses.
# AGP 8.13 supports compileSdk up to API level 36.1 (developer.android.com/
# build/releases/agp-8-13-0-release-notes, checked live), so compileSdk 36
# (core/designsystem/build.gradle.kts) is unaffected. Gradle wrapper reverted
# to 8.14.5 to match (AGP 8.13's minimum is Gradle 8.13).
android-gradle-plugin = "8.13.2"
compose-bom = "2026.08.00"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin-test" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# AGP 8.13 (see android-gradle-plugin above) has no built-in Kotlin support —
# this is the classic, universally-supported model: every AGP-8.x Android
# module applies these explicitly.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }

[versions]
# One version catalog project-wide (DEVELOPMENT_PROTOCOL.md rule 37) — no module
# pins a library version independently. Entries below are only for dependencies
# actually consumed by an existing module today; a version is added here only
# when a DEV task actually needs it (DEPENDENCY_POLICY.md — "actually necessary"),
# not speculatively for future modules.
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
junit-jupiter = "5.13.4"
kotlin-test = "2.4.20"
# Pinned to the last stable 1.x line under the pre-rename coordinates
# (io.gitlab.arturbosch.detekt). detekt 2.0 exists only as an alpha
# (dev.detekt coordinates) as of this pin — reconsider once 2.0 is stable.
# Verified working under Gradle 8.14.5 (DEV-001/DEV-002).
detekt = "1.23.8"
ktlint-gradle = "14.2.0"
# DEV-003's iteration history (see gradle.properties and DEVELOPMENT_LOG.md
# for the full account): iterations 1-9 chased AGP 9.4.0's built-in-Kotlin
# support as the cause of a plugin-resolution error and, after 8 failures,
# stepped back to AGP 8.13.2 to escape that feature area entirely — wrong:
# the identical error reproduced under 8.13.2 too. Iterations 10-11 found the
# real cause (root build.gradle.kts wasn't apply-false'ing every plugin used
# anywhere in the build) and fixed it independent of AGP version. With that
# fixed, AGP 8.13.2 turned out to be flatly incompatible anyway: Compose BOM
# 2026.08.00's own dependencies require AGP >=9.1.0 and compileSdk >=37
# (a real CI AAR-metadata failure, iteration 11) — so back to 9.4.0, this
# time with the actual bug already fixed at the root. Requires Gradle
# >=9.6.0 (checked live against AGP's release notes).
android-gradle-plugin = "9.4.0"
compose-bom = "2026.08.00"
# Room 2.x (androidx.room package), not the KMP-focused 3.0 rewrite (androidx.room3,
# a different package/artifact family) — DEV-005 confirmed with the product owner that
# :core:database stays a standard Android module for now (KMP would need dl.google.com
# for Room/sqlite artifacts regardless of Android vs JVM target in this sandbox, since
# they're Google-Maven-only either way, so it wouldn't have bought any real local-
# verification benefit here). 2.8.5 is the latest stable 2.x release, checked live.
room = "2.8.5"
# KSP's newer versioning (2.3.x) is decoupled from the Kotlin-version-prefixed scheme
# older releases used; checked live against Maven Central's own version metadata for
# the plugin marker artifact rather than assumed compatible with Kotlin 2.4.20.
ksp = "2.3.12"
# Room DAO tests need an actual Android runtime (Room generates real SQLite-backed
# implementations) — Robolectric is the standard, officially-documented way to run
# that on the JVM without an emulator. Robolectric still has no official JUnit 5
# support as of this pin (checked live: only a small, unofficial, actively-evolving
# community extension exists) — DEPENDENCY_POLICY.md prefers the mature, officially-
# supported path over an experimental one, so this one test area uses plain JUnit 4
# (Robolectric's own long-standing, documented model), not this project's usual
# JUnit 5 (:core:common/:core:model) — a deliberate, stated exception, not a drift.
junit4 = "4.13.2"
robolectric = "4.17"
androidx-test-junit = "1.3.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin-test" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# AGP 9's built-in Kotlin support is disabled (android.builtInKotlin=false in
# gradle.properties), so every Android module applies these explicitly —
# see that file for why.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
# Declared apply-false at root from the start (DEV-003 retrospective, ANTI_ERROR_STANDARD.md
# §11) — every plugin used anywhere in the build gets one root declaration up front,
# rather than discovering the gap the hard way again.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
